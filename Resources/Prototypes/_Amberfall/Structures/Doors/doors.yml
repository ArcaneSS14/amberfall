- type: entity
  abstract: true
  parent: BaseMaterialDoorNavMap
  id: BaseMedievalDoor
  name: old door
  components:
  - type: Sprite
    sprite: _Amberfall/Structures/Doors/doors.rsi
    layers:
    - state: wood
      map: ["enum.DoorVisualLayers.Base"]
  - type: Door
    bumpOpen: false
    clickOpen: true
    canCrush: false
    openingAnimationTime: 0.8
    closingAnimationTime: 0.8
    openSound:
      path: /Audio/Effects/door_open.ogg
    closeSound:
      path: /Audio/Effects/door_close.ogg
  - type: Damageable
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:DoActsBehavior
        acts: ["Destruction"]

- type: entity
  parent: BaseMedievalDoor
  id: MedievalDoorWood
  name: rough wooden door
  components:
  - type: Sprite
    layers: [{ state: wood, map: ["enum.DoorVisualLayers.Base"] }]
  - type: Door
    closedSpriteState: wood
    openingSpriteState: woodopening
    closingSpriteState: woodclosing
    openSpriteState: woodopen

