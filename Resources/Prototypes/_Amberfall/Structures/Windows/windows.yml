- type: entity
  abstract: true
  parent: BaseStructure
  id: BaseDecorativeWindow
  name: old window
  description: A window of old-fashioned construction. It can be opened and climbed through.
  placement:
    mode: SnapgridCenter
    snap: [Window]
  components:
  - type: WallMount
    arc: 360
  - type: InteractionOutline
  - type: Tag
    tags: [Structure, Directional, Window]
  - type: MeleeSound
    soundGroups:
      Brute:
        collection: GlassSmack
  - type: Sprite
    sprite: _Amberfall/Structures/Windows/roguewindow.rsi
    drawdepth: WallTops
    layers:
    - state: window-solid
      map: ["enum.ToggleableVisuals.Layer"]
  - type: Icon
    sprite: _Amberfall/Structures/Windows/roguewindow.rsi
    state: window-solid
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        density: 500
        mask: [FullTileMask]
        layer: [FullTileLayer]
  - type: OpenableWindow
    fixtureId: fix1
    climbDelay: 1.5
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: { visible: false }
          False: { state: window-solid, visible: true }
  - type: Occluder
  - type: BlockWeather
  - type: SoundBlocker
  - type: Repairable
  - type: Damageable
    damageModifierSet: Glass
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: ExaminableDamage
    messages: WindowMessages
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 40
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlass:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [Destruction]
  - type: DamageVisuals
    thresholds: [10, 20, 30]
    trackAllDamage: true
    damageOverlay:
      sprite: Structures/Windows/cracks.rsi
  - type: RequireProjectileTarget

- type: entity
  parent: BaseDecorativeWindow
  id: DecorativeWindowSolid
  name: solid old window

- type: entity
  parent: BaseDecorativeWindow
  id: DecorativeWindowWood
  name: wooden window
  components:
  - type: Sprite
    layers: [{ state: woodwindow, map: ["enum.ToggleableVisuals.Layer"] }]
  - type: Icon
    state: woodwindow
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: { state: woodwindowop, visible: true }
          False: { state: woodwindow, visible: true }
  - type: Damageable
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 60
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:DoActsBehavior
        acts: [Destruction]

