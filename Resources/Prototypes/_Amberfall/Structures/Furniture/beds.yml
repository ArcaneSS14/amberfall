    sprite: _Amberfall/Structures/Furniture/Beds/beds.rsi
  - type: Icon
    sprite: _Amberfall/Structures/Furniture/Beds/beds.rsi
  - type: Damageable
    damageModifierSet: Wood

- type: entity
  parent: BaseRusticBed
  id: RusticBed
  name: rustic bed
  components: [{ type: Sprite, state: bed }, { type: Icon, state: bed }]

- type: entity
