  components: [{ type: Sprite, state: haybed }, { type: Icon, state: haybed }]

- type: entity
  parent: BaseRusticBed
  id: WoolBed
  name: wool bed
  components: [{ type: Sprite, state: woolbed }, { type: Icon, state: woolbed }]

- type: entity
  parent: BaseRusticBed
  id: Bedroll
  name: bedroll
  components: [{ type: Sprite, state: bedroll }, { type: Icon, state: bedroll }]

- type: entity
  parent: BaseRusticBed
