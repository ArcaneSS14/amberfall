- type: entity
  abstract: true
  parent: BaseStructure
  id: BaseTallProp
  name: decoration
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _Amberfall/Structures/Decoration/statues.rsi
    drawdepth: Overdoors
  - type: Icon
    sprite: _Amberfall/Structures/Decoration/statues.rsi
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-0.35,0.35,0.35"
        density: 100
        mask: [Impassable]
        layer: [MidImpassable, LowImpassable]

- type: entity
  abstract: true
  parent: BaseTallProp
  id: BaseTallStatue
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-1,0.35,-0.25"
        density: 100
        mask: [Impassable]
        layer: [MidImpassable, LowImpassable]

- type: entity
  abstract: true
  parent: BaseTallStatue
  id: BaseKnightStatue
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-1,0.35,0.55"
        density: 100
        mask: [Impassable]
        layer: [MidImpassable, LowImpassable]

- type: entity
  abstract: true
  parent: BaseWildFlora
  id: BaseHangingProp
