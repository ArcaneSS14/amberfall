- type: entity
  abstract: true
  parent: BaseWall
  id: BaseStyledWall
  components:
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: BaseStyledWall
  id: WallBlueMossy
  name: blue mossy wall
  description: Old stonework covered in cold blue moss.
  components:
  - type: Sprite
    sprite: _Amberfall/Structures/Walls/blue_mossy.rsi
  - type: Icon
    sprite: _Amberfall/Structures/Walls/blue_mossy.rsi
  - type: IconSmooth
    key: walls
    base: blue_mossy

- type: entity
  parent: BaseStyledWall
  id: WallOrnateStone
  name: ornate stone wall
  description: Massive stonework decorated with a severe geometric relief.
  components:
  - type: Sprite
    sprite: _Amberfall/Structures/Walls/boss_wall.rsi
  - type: Icon
    sprite: _Amberfall/Structures/Walls/boss_wall.rsi
  - type: IconSmooth
    key: walls
    base: ornate_stone

- type: entity
  parent: BaseStyledWall
  id: WallRoughBrick
  name: rough brick wall
  description: Uneven brickwork held together by old mortar.
  components:
  - type: Sprite
    sprite: _Amberfall/Structures/Walls/brick_wall.rsi
  - type: Icon
    sprite: _Amberfall/Structures/Walls/brick_wall.rsi
  - type: IconSmooth
    key: walls
    base: rough_brick

- type: entity
  parent: BaseStyledWall
  id: WallCraftedStone
  name: crafted stone wall
  description: Carefully fitted blocks of worked stone.
  components:
  - type: Sprite
    sprite: _Amberfall/Structures/Walls/craftstone.rsi
  - type: Icon
    sprite: _Amberfall/Structures/Walls/craftstone.rsi
  - type: IconSmooth
    key: walls
    base: crafted_stone

- type: entity
  parent: BaseStyledWall
  id: WallCastleStone
  name: castle wall
  description: Thick masonry built to endure a siege.
  components:
  - type: Sprite
    sprite: _Amberfall/Structures/Walls/cwall.rsi
  - type: Icon
    sprite: _Amberfall/Structures/Walls/cwall.rsi
  - type: IconSmooth
    key: walls
    base: castle_stone

- type: entity
  parent: BaseStyledWall
  id: WallHardRock
  name: hard rock wall
  description: A dense mass of stubborn stone.
  components:
  - type: Sprite
    sprite: _Amberfall/Structures/Walls/hardrock.rsi
  - type: Icon
    sprite: _Amberfall/Structures/Walls/hardrock.rsi
  - type: IconSmooth
    key: walls
    base: hard_rock

- type: entity
  parent: BaseStyledWall
  id: WallRedMossy
  name: red mossy wall
  description: Ancient stonework overgrown with dark red moss.
  components:
  - type: Sprite
    sprite: _Amberfall/Structures/Walls/red_mossy.rsi
  - type: Icon
    sprite: _Amberfall/Structures/Walls/red_mossy.rsi
  - type: IconSmooth
    key: walls
    base: red_mossy

- type: entity
  parent: BaseStyledWall
  id: WallNaturalRock
  name: natural rock wall
  description: A rough outcrop of unworked rock.
  components:
  - type: Sprite
    sprite: _Amberfall/Structures/Walls/rock_wall.rsi
  - type: Icon
    sprite: _Amberfall/Structures/Walls/rock_wall.rsi
  - type: IconSmooth
    key: walls
    base: natural_rock

- type: entity
  parent: BaseStyledWall
  id: WallPipework
  name: pipework wall
  description: A solid wall crossed by exposed pipes.
  components:
  - type: Sprite
    sprite: _Amberfall/Structures/Walls/roguepipe.rsi
  - type: Icon
    sprite: _Amberfall/Structures/Walls/roguepipe.rsi
  - type: IconSmooth
    key: walls
    base: pipework

- type: entity
  parent: BaseStyledWall
  id: WallRoughWood
  name: rough wooden wall
  description: Heavy timber laid into a crude but sturdy wall.
  components:
  - type: Sprite
    sprite: _Amberfall/Structures/Walls/roguewood.rsi
  - type: Icon
    sprite: _Amberfall/Structures/Walls/roguewood.rsi
  - type: IconSmooth
    key: walls
    base: rough_wood
  - type: Damageable
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:DoActsBehavior
        acts: [Destruction]

- type: entity
  parent: BaseStyledWall
  id: WallStone
  name: stone wall
  description: A wall assembled from broad stone blocks.
  components:
  - type: Sprite
    sprite: _Amberfall/Structures/Walls/stone_wall.rsi
  - type: Icon
    sprite: _Amberfall/Structures/Walls/stone_wall.rsi
  - type: IconSmooth
    key: walls
    base: stone

- type: entity
  parent: BaseStyledWall
  id: WallStoneBrick
  name: stone brick wall
  description: A sturdy wall of tightly packed stone bricks.
  components:
  - type: Sprite
    sprite: _Amberfall/Structures/Walls/stonebrick.rsi
  - type: Icon
    sprite: _Amberfall/Structures/Walls/stonebrick.rsi
  - type: IconSmooth
    key: walls
    base: stone_brick
