- type: entity
  abstract: true
  parent: BaseStructure
  id: BaseRusticIgnitableLight
  name: unlit fire
  description: Add suitable fuel, then light it with a burning object. Interact to extinguish it.
  placement:
    mode: SnapgridCenter
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 320
        mask:
        - Impassable
        layer:
        - Impassable
  - type: Appearance
  - type: FuelableFire
    capacity: 300
    burnRate: 1
  - type: PointLight
    enabled: false
    radius: 12
    energy: 3
    color: "#FF8A30"
  - type: AmbientSound
    enabled: false
    volume: -6
    range: 5
    sound:
      path: /Audio/Ambience/Objects/fireplace.ogg
  - type: Damageable
    damageModifierSet: Wood
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]

- type: entity
  abstract: true
  parent: BaseRusticIgnitableLight
  id: BaseRusticFirePair
  components:
  - type: Sprite
    sprite: _Amberfall/Objects/Decoration/lighting.rsi
    layers:
    - state: stonefire0
      map: ["enum.ToggleableVisuals.Layer"]
  - type: Icon
    sprite: _Amberfall/Objects/Decoration/lighting.rsi
    state: stonefire0
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: { state: stonefire1, shader: null }
          False: { state: stonefire0, shader: null }

