# Eternal variants for mapping. BaseEternalFire can also be mixed into another
# FuelableFire structure to make it start lit, consume no fuel, and resist manual extinguishing.
- type: entity
  abstract: true
  id: BaseEternalFire
  suffix: Eternal
  components:
  - type: FuelableFire
    fuel: 0
    capacity: 0
    burnRate: 0
    burning: true
    infiniteFuel: true
    canExtinguish: false

