## PARITY

- type: scrollPrayer
  id: Counter
  verb: TEACH
  subjects: [ "COUNTER" ]
  items:
    id: TableCounterMetal

- type: scrollPrayer
  id: CounterMagic
  verb: TEACH
  subjects: [ "COUNTER-MAGIC", "COUNTER MAGIC" ]
  items:
    id: CosmicTable

- type: scrollPrayer
  id: Dash
  verb: TEACH
  subjects: [ "DASH" ]
  effects:
  - !type:AddComponents
    components:
    - type: DashAction
      actionProto: ActionDashMoth

- type: scrollPrayer
  id: Devour
  verb: TEACH
  subjects: [ "DEVOUR" ]
  effects:
  - !type:AddComponents
    components:
    - type: Devourer # vore
      foodPreferenceWhitelist:
        components:
        - HumanoidProfile
      stomachStorageWhitelist:
        components:
        - HumanoidProfile
      chemical: Ichor
      healRate: 7.5
      whitelist:
        components:
        - HumanoidProfile # can only eat people/monkey

- type: scrollPrayer
