- type: entity
  abstract: true
  parent: FoodBase
  id: BasePerishableFood
  components:
  - type: BurnableFood
    burnTemp: 550

# FoodInjectableBase without perishable stuff
- type: entity
  abstract: true
  parent: FoodBase
  id: FoodUnperishableInjectableBase
  components:
  - type: SpaceGarbage
  - type: InjectableSolution
    solution: food
  - type: RefillableSolution
    solution: food

# FoodProduceBase without perishable stuff
- type: entity
  abstract: true
  parent: FoodBase
  id: FoodProduceUnperishableBase
  components:
  - type: Solution
  - type: Sprite
    state: produce
  - type: PotencyVisuals
  - type: Appearance
  - type: Extractable
    grindableSolutionName: food
