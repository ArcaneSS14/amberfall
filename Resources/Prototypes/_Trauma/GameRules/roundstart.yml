# i love this dogshit system nobody has improved for 2 years :)
- type: entity
  parent: BaseGameRule
  id: SubGamemodesRuleNoHeretic
  components:
  - type: SubGamemodes
    rules:
    - id: Thief
      prob: 0.5
    - id: Devil
      prob: 0.02
    - id: ShadowlingRoundstart
      prob: 0.02
    - id: WraithRoundstart
      prob: 0.1

- type: entity
  parent: BaseGameRule
  id: SubTraitorRandom
  components:
  - type: SubGamemodes
    rules:
    - id: SubTraitor
      prob: 0.2

- type: entity
  parent: [ BaseShadowlingRule, BaseRoundstartAntagRule ]
  id: ShadowlingGamemode
  components:
  - type: GameRule
    minPlayers: 30
  - type: AntagSelection
    antags:
    - !type:FixedAntagCount
      proto: Shadowling

- type: entity
  parent: TraitorReinforcement
  id: TraitorReinforcementNukeOps
  components:
  - type: AntagPlayerEffects
    effects:
    - !type:NestedEffect
      proto: InstallHypoportNukie
    - !type:InstallOrganChip
      chip: SkillChipNukie
