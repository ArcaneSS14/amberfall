- type: reagent
  id: BaseDrink
  group: NonAlcoholicDrinks # Goob - Drinks guidebook split
  abstract: true
  slipData:
    requiredSlipSpeed: 3.5
  metabolisms:
    Digestion:
      effects:
      - !type:SatiateThirst
        factor: 3
  reactiveEffects:
  plantMetabolism:
  - !type:PlantAdjustWater
    amount: 1
  tileReactions:
  - !type:SpillIfPuddlePresentTileReaction { }

- type: reagent
  id: BaseSoda
  parent: BaseDrink
  abstract: true
  metabolisms:
    Digestion:
      effects:
      - !type:SatiateThirst
        factor: 2
  plantMetabolism:
  - !type:PlantAdjustNutrition
    amount: 0.1
  - !type:PlantAdjustWater
    amount: 0.1
  - !type:PlantAdjustHealth
    amount: -0.1
  footstepSound:
    collection: FootstepSlime
  fizziness: 0.5

- type: reagent
  id: BaseAlcohol
  group: AlcoholicDrinks # Goob - Drinks guidebook split
  abstract: true
  slipData:
    requiredSlipSpeed: 3.5
  friction: 0.4
  metabolisms:
    Digestion:
      metabolites:
        Ethanol: 0.12
      effects:
      - !type:SatiateThirst
        factor: 2
  reactiveEffects:
  plantMetabolism:
  - !type:PlantAdjustNutrition
    amount: 0.25
  - !type:PlantAdjustWater
    amount: 0.7

- type: reagent
  id: BaseJuice
  parent: BaseDrink
  abstract: true
  flavor: sweet
  footstepSound:
    collection: FootstepSlime
