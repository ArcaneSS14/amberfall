# Intended to very occasionally be useful for prisoners, so mostly functional items instead of fluff

- type: entityTable
  id: FillLockerEmergencyStandard
  table: !type:AllSelector
    children:
    - id: ClothingMaskBreath
    - id: ClothingOuterSuitEmergency
    - id: ToolboxEmergencyMimic
      prob: 0.0025
    # </Trauma>
    - id: WeaponFlareGun
      prob: 0.1


- type: entityTable
  id: FillLockerEmergencyN2Standard
  table: !type:AllSelector
    children:
    - id: ClothingMaskBreath
    - id: ClothingOuterSuitEmergency
    - id: ToolboxEmergencyMimic
      prob: 0.0025
    # </Trauma>


- type: entityTable
  id: FillLockerFireStandard
  table: !type:AllSelector
    children:
    - id: ClothingOuterSuitFire
    - id: ClothingHeadHelmetFire
    - id: ClothingMaskGas
    - id: CrowbarRed
    - !type:GroupSelector
      children:
      - id: FireExtinguisher
        weight: 98
      - id: SprayBottleWater #It's just budget cut after budget cut man
        weight: 2


- type: entityTable
  id: MaintenanceLockerLoot
  table: !type:AllSelector
    children:
    - id: StrangePill
      prob: 0.15
    # <Trauma>
    - !type:NestedSelector
      tableId: SprayPaintsDeath
      prob: 0.075
    - id: GunpowderBottlePartFull
      prob: 0.01
    - id: SheetPlasteel10
      prob: 0.05
    - id: SheetBrass10
      prob: 0.05
    - id: Whetstone
      prob: 0.25
    - id: WeaponBracing
      prob: 0.25
    - id: EmptyScroll
      prob: 0.001
    - id: KnittedBalaclava
      prob: 0.35
    # </Trauma>
    # Tools
    - !type:NestedSelector
      tableId: MaintToolsTable
      rolls: !type:RangeNumberSelector
        range: 1, 5
    # Fluff
    - !type:NestedSelector
      tableId: MaintFluffTable
      prob: 0.33
      rolls: !type:RangeNumberSelector
        range: 0, 2
    # Plushies
    - !type:NestedSelector
      tableId: AllPlushiesTable
      prob: 0.10
      rolls: !type:RangeNumberSelector
        range: 1, 2
    - !type:NestedSelector
      tableId: MaintenancePlushies
      prob: 0.02

    # Weapons
    - !type:NestedSelector
      tableId: MaintWeaponTable
      prob: 0.075
    # Syndie Loot
    - !type:NestedSelector
      tableId: SyndieMaintLoot
      prob: 0.05
    # Recursive
    - id: ClosetMaintenanceFilledRandom
      prob: 0.01


- type: entityTable
  id: SyndieMaintLoot
  table: !type:GroupSelector
    children:
    - !type:GroupSelector
      children:
      - id: ClothingUniformJumpsuitOperative
      - id: ClothingUniformJumpskirtOperative
    - id: ClothingBackpackDuffelSyndicate
    - id: CyberPen
    - id: CigPackSyndicate
    - id: ClothingBackpackDuffelSyndicatePyjamaBundle
    - id: ClothingBeltMilitaryWebbing
    - id: ClothingShoesBootsCombatFilled
    - id: ToolboxSyndicateFilled
    - id: BalloonSyn
    - id: WeaponSniperMosin
      weight: 2
    - id: ClothingHandsKnuckleDustersSyndicate
    - id: ExperimentalCircuitBoard # Goob edit

- type: entityTable
  id: MaintenancePlushies
  table: !type:GroupSelector
    children:
    - id: PlushieLizardJobBoxer
    - id: PlushieLizardJobClown
    - id: PlushieLizardJobLibrarian
