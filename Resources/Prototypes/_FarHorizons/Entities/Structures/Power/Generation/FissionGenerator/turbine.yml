- type: entity
  id: TurbineFlowArrow
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Markers/directional_arrow_indicator.rsi
    color: "#FFFFFFBB"
    layers:
    - state: blue_arrow
      rotation: 90
      offset: 2, -1
    - state: blue_arrow
      rotation: 90
      offset: -2, -1
  - type: TimedDespawn
    lifetime: 2
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
  parent: TurbineFlowArrow
  id: TurbineSmallFlowArrow
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - state: blue_arrow
      rotation: 180
      offset: 1, -2
    - state: blue_arrow
      rotation: 0
      offset: -1, -2

- type: entity
  id: GasTurbineAlarmEntity
  categories: [ HideSpawnMenu ]
  components:
  - type: AmbientSound
    volume: -2
    range: 15
    enabled: false
    sound:
      path: /Audio/_FarHorizons/Machines/alarm_buzzer.ogg
