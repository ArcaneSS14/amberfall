- type: entity
  parent: [ BaseStructure, BaseNuclearPropertiesSteel ]
  id: NuclearReactorMelted # This is more of a decoration than anything else
  suffix: Melted
  name: nuclear reactor
  description: A broken nuclear reactor vessel. It glows with heat and radiation.
  components:
  - type: Sprite
    sprite: _FarHorizons/Structures/Power/Generation/FissionGenerator/nuclear_reactor.rsi
    layers:
    - state: reactorbroken
  - type: Rotatable
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-2.5,-2.5,2.5,2"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
        - HighImpassable
  - type: RadiationSource
    intensity: 7
  - type: InteractionOutline
  - type: PointLight
    energy: 0.1
    falloff: 2
    radius: 3.5
    color: "#FFAAAAFF"

# Small crew nuclear reactors
- type: entity
  parent: NuclearReactorMelted
  id: NuclearReactorSmallMelted
  name: small nuclear reactor
  suffix: Melted
  description: A broken nuclear reactor vessel. It glows with heat and radiation.
  components:
  - type: Sprite
    sprite: _FarHorizons/Structures/Power/Generation/FissionGenerator/small_nuclear_reactor.rsi
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.5,-1.5,1.5,1.5"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
        - HighImpassable
  - type: RadiationSource
    intensity: 5
  - type: PointLight
    radius: 2.5

# Salvage nuclear reactors
- type: entity
  parent: NuclearReactorMelted
  id: NuclearReactorMeltedSalvage
  suffix: "Melted, Salvage"
  description: A nuclear reactor vessel, long since melted down. It still glows with residual heat and radiation.
  components:
  - type: RadiationSource
    intensity: 3.5
  - type: PointLight
    energy: 0.025

# Small salvage nuclear reactors
- type: entity
  parent: NuclearReactorSmallMelted
  id: NuclearReactorSmallMeltedSalvage
  suffix: "Melted, Salvage"
  description: A nuclear reactor vessel, long since melted down. It still glows with residual heat and radiation.
  components:
  - type: RadiationSource
    intensity: 2.5
  - type: PointLight
    energy: 0.025

# Nuclear debris resultant from a meltdown
- type: entity
  parent: BaseItem
  id: NuclearDebrisChunk
  name: nuclear debris
  description: You do not see the graphite on the floor. You're in shock. Report to medical.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _FarHorizons/Structures/Power/Generation/FissionGenerator/nuclear_debris.rsi
    layers:
    - state: graphite_damaged_0
      map: [ "base" ]
  - type: Item
    size: Huge
  - type: RandomSprite
    available:
    - base:
        graphite_damaged_0: ""
        graphite_damaged_0_mirrored: ""
        graphite_damaged_1: ""
        graphite_damaged_1_mirrored: ""
        graphite_damaged_2: ""
        graphite_damaged_2_mirrored: ""
        graphite_damaged_3: ""
        graphite_damaged_3_mirrored: ""
        graphite_damaged_4: ""
        graphite_damaged_4_mirrored: ""
  - type: RadiationSource
    intensity: 1.6

# Arrows to indicate flow for nuclear reactors and turbines
- type: entity
  id: ReactorFlowArrow
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Markers/directional_arrow_indicator.rsi
    color: "#FFFFFFBB"
    layers:
    - state: blue_arrow
      rotation: 90
      offset: 3, 1
    - state: blue_arrow
      rotation: 90
      offset: -3, -1
  - type: TimedDespawn
    lifetime: 2
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
  parent: ReactorFlowArrow
  id: ReactorSmallFlowArrow
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - state: blue_arrow
      rotation: 0
      offset: -1, 2
    - state: blue_arrow
      rotation: 180
      offset: 1, 2

# Pipes the reactor uses to connect to the pipe network
- type: entity
  id: NuclearMachineGasPipe
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    anchored: true
  - type: Anchorable
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
  id: ReactorAlarmEntity
  categories: [ HideSpawnMenu ]
  components:
  - type: AmbientSound
    volume: -3
    range: 15
    enabled: false
    sound:
      path: /Audio/_FarHorizons/Machines/reactor_alarm_1.ogg
