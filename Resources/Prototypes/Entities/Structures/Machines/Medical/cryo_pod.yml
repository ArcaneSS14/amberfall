- type: entity
  parent: SolutionSmall
  id: SolutionCryoBuffer
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    id: injectionBuffer

- type: entity
  parent: BaseMachine
  id: CryoPodDestroyed
  name: destroyed cryo pod
  description: A cryo pod that has seen better days. It's entirely inoperable; not good for anything but scrap.
  components:
  - type: Sprite
    sprite: Structures/Machines/Medical/cryopod.rsi
    drawdepth: Mobs
    noRot: true
    offset: 0, 0.5
    state: pod-cracked
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 200
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: PhysicalComposition
    materialComposition:
      Steel: 2000 # 20 sheets
      Glass: 1000 # 10 sheets
