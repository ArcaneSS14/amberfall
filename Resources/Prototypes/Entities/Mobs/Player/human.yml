#Syndie
- type: entity
  parent: MobHuman
  id: MobHumanSyndicateAgentBase
  name: syndicate agent
  suffix: Human, Base
  components:
  - type: RandomHumanoidAppearance
    randomizeName: false
  - type: RandomMetadata
    nameSegments: [NamesDeathCommando]
  - type: NpcFactionMember
    factions:
    - Syndicate

- type: entity
  parent: MobHumanSyndicateAgentBase
  id: MobHumanSyndicateAgent
  name: syndicate agent
  suffix: Human, Traitor
  components:
  # make the player a traitor once its taken
  - type: AutoTraitor
    profile: TraitorReinforcement

- type: entity
  parent: MobHumanSyndicateAgent
  id: MobHumanSyndicateAgentMedic
  name: syndicate medic
  components: []
- type: entity
  parent: MobHumanSyndicateAgent
  id: MobHumanSyndicateAgentSpy
  name: syndicate spy
  components: []
- type: entity
  parent: MobHumanSyndicateAgent
  id: MobHumanSyndicateAgentThief
  name: syndicate thief
  components: []
- type: entity
  parent: MobHumanSyndicateAgentBase
  id: MobHumanSyndicateAgentNukeops # Reinforcement exclusive to nukeops uplink
  suffix: Human, NukeOps
  components:
  # <Trauma>
  - type: AutoTraitor
    profile: TraitorReinforcementNukeOps
  # </Trauma>
  - type: NukeOperative
  - type: RandomMetadata
    nameSegments:
    - NamesSyndicateNormal
    nameFormat: name-format-nukie-operator
- type: entity
  categories: [ HideSpawnMenu ]
  name: Nuclear Operative
  parent: MobHuman
  id: MobHumanNukeOp
  components:
  # <Trauma>
  - type: TriggerOnSpawn
  - type: EntityEffectOnTrigger
    effects:
    - !type:NestedEffect
      proto: InstallHypoportNukie
    - !type:InstallOrganChip
      chip: SkillChipNukie
  # </Trauma>
  - type: NukeOperative
  - type: RandomHumanoidAppearance

- type: entity
  categories: [ HideSpawnMenu ]
  parent: MobHuman
  id: MobHumanLoneNuclearOperative
  name: Lone Operative
  components:
  - type: RandomHumanoidAppearance
    randomizeName: false
  - type: NukeOperative
  - type: RandomMetadata
    nameSegments:
    - NamesSyndicatePrefix
    - NamesSyndicateNormal
    nameFormat: name-format-nukie-generic
  - type: NpcFactionMember
    factions:
    - Syndicate
