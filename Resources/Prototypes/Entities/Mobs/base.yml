# The literal bare minimum needed to be a controllable mob. Cannot move but can interact.
- type: entity
  abstract: true
  save: false
  id: BaseControllable
  components:
  # <Trauma>
  - type: LanguageSpeaker
  - type: CollectiveMind
  - type: SpecialAnimationViewer
  - type: Penetratable
    penetrateDamage: 15 # Kill million mices
    damagePenalty: 0.05
  - type: AnimatedEmotes
  - type: Viewcone
  - type: ViewconeOccludable # if it can move, you probably can't remember it forever?
    useMemory: false # forgor
  - type: ViewconeFootstepsEffect # if you can hear it move you will see steps effects on screen
  # </Trauma>
  - type: Sprite
    noRot: true
    drawdepth: Mobs
  - type: GravityAffected
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 50
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Clickable
  - type: InteractionOutline
  - type: Input
    context: "human"
  - type: Actions
  - type: Alerts
  - type: Appearance
  - type: RotationVisuals
    defaultRotation: 0
    horizontalRotation: 0
  - type: DoAfter
  - type: Examiner
  - type: Eye
  - type: ContentEye
  - type: CameraRecoil
  - type: MindContainer
  - type: RequireProjectileTarget
    active: False

# The progenitor. This should only container the most basic components possible.
# Only put things on here if every mob *must* have it. This includes ghosts.
- type: entity
  abstract: true
  save: false
  parent: BaseControllable
  id: BaseMob
  components:
  - type: MobCollision
  - type: Physics
    bodyType: KinematicController
  - type: InputMover
  - type: MobMover
  - type: MovementSpeedModifier
  - type: LagCompensation
  - type: StunVisuals

- type: entity
  save: false
  id: MobPolymorphable
  abstract: true
  components:
  - type: Polymorphable

# Used for mobs that have health and can take damage.
- type: entity
  save: false
  id: MobDamageable
  abstract: true
  components:
  - type: Damageable
  - type: Injurable
    damageContainer: Biological
  - type: Destructible
    thresholds:
    # <Trauma> - upstream removed gibbing lol
    - trigger:
        !type:DamageTypeTrigger
        damageType: Blunt
        damage: 400
      behaviors:
      - !type:GibBehavior
    # </Trauma>
    - trigger:
        !type:DamageTypeTrigger
        damageType: Radiation
        damage: 15
      behaviors:
      - !type:PopupBehavior
        popup: mouth-taste-metal
        popupType: LargeCaution
        targetOnly: true
    - trigger:
        !type:DamageTypeTrigger
        damageType: Radiation
        damage: 40
      behaviors:
      - !type:VomitBehavior
  - type: RadiationReceiver
  - type: Stamina
  - type: StunVisuals
  - type: MobState
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Critical
      200: Dead
  - type: MobStateActions
    actions:
      Critical:
      - ActionCritSuccumb
      - ActionCritFakeDeath
      - ActionCritLastWords
  - type: StoreDamageTakenOnMind
  - type: Deathgasp
  - type: HealthExaminable
    examinableTypes:
    - Blunt
    - Slash
    - Piercing
    - Ballistic # Trauma
    - Heat
    - Shock
    - Cold
    - Caustic
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 5
    soundHit:
      path: /Audio/Effects/hit_kick.ogg
  - type: Pullable
  - type: LightningTarget
    priority: 2
    lightningExplode: false
  - type: GhostOnMove
    mustBeDead: true

# Used for mobs that can enter combat mode and can attack.
- type: entity
  save: false
  id: MobCombat
  abstract: true
  components:
  # <Trauma>
  - type: ViewconeMeleeEffect
  # </Trauma>
  - type: CombatMode
  - type: MeleeWeapon
    hidden: true
    soundHit:
      collection: MetalThud
    damage:
      types:
        Blunt: 5

# Used for mobs that are affected by atmospherics, pressure, and heat
- type: entity
  save: false
  id: MobAtmosExposed
  abstract: true
  components:
  - type: ThermalRegulator
    metabolismHeat: 800
    radiatedHeat: 100
    implicitHeatRegulation: 500
    sweatHeatRegulation: 2000
    shiveringHeatRegulation: 2000
    normalBodyTemperature: 310.15
    thermalRegulationTemperatureThreshold: 2
- type: entity
  parent: MobAtmosExposed
  id: MobAtmosStandard
  abstract: true
  components:
  - type: ThermalRegulator
    metabolismHeat: 800
    radiatedHeat: 100
    implicitHeatRegulation: 250
    sweatHeatRegulation: 500
    shiveringHeatRegulation: 500
    normalBodyTemperature: 310.15
    thermalRegulationTemperatureThreshold: 2
- type: entity
  save: false
  id: MobFlammable
  abstract: true
- type: entity
  save: false
  id: MobRespirator
  abstract: true
- type: entity
  save: false
  id: MobBloodstream
  abstract: true
  components:
  - type: SolutionManager
  - type: InjectableSolution
    solution: bloodstream
  - type: Bloodstream
    bloodlossDamage:
      types:
        Bloodloss: 0.5
    bloodlossHealDamage:
      types:
        Bloodloss: -1

# Used for mobs that should slightly see in the dark
- type: entity
  save: false
  id: MobNightVision
  abstract: true
  components:
  - type: NightVision
    action: ActionToggleNightVision # Trauma
    prioritized: false
    relayOverlay: false # In case default value ever changes
    lightingColor: '#FFFFFF33' # Basically makes it impossible for things to be "Pitch black" but can still be dark. # Trauma - was "#FFFFFF15"
