- type: entity
  description: "If you want to get cancer, might as well do it in style."
  id: BaseSmokable
  parent: [SolutionSmokable, SolutionTiny, BaseItem]
  abstract: true
  components:
  - type: Reactive
    groups:
      Extinguish: [ Touch ]
  - type: Smokable
  - type: Sprite
  - type: Appearance
  - type: BurnStateVisuals
  - type: Tag
    tags:
    - Trash
  - type: SpaceGarbage
  - type: StaticPrice
    price: 5
  - type: InjectableSolution
    solution: smokable

# Base for all cigars and cigarettes.
- type: entity
  parent: BaseSmokable
  id: BaseCigar
  abstract: true
  components:
  # <Trauma>
  - type: Extractable
    grindableSolutionName: smokable
  - type: Cautery
    speed: 0.4
  - type: SurgeryTool
    startSound:
      path: /Audio/Effects/cig_light.ogg
    endSound:
      path: /Audio/Effects/cig_snuff.ogg
  # </Trauma>
  - type: Smokable
    exposeTemperature: 1173.15
  - type: Tag
    tags:
    - Trash
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nicotine
        Quantity: 10

- type: entity
  parent: BaseSmokable
  id: BaseSmokingPipe
  abstract: true
  components:
  - type: Smokable
    exposeTemperature: 1173.15
  - type: ContainerContainer
    containers:
      bowl_slot: !type:ContainerSlot
  - type: ItemSlots
- type: entity
  parent: [SolutionSmokable, SolutionTiny, BaseItem]
  id: BaseVape
  abstract: true
  components:
  - type: RefillableSolution
    solution: smokable
  - type: ExaminableSolution
    solution: smokable
