- type: entity
  abstract: true
  id: BaseKudzu
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Appearance
  - type: Transform
    anchored: true
  - type: Physics
  - type: Kudzu
  - type: GrowingKudzu
  - type: ActiveEdgeSpreader
  - type: EdgeSpreader
    id: Kudzu
  - type: SpeedModifierContacts
    affectAirborne: true

- type: entity
  parent: [ BaseKudzu, SolutionFood ]
  id: Kudzu
  name: kudzu
  description: A rapidly growing, dangerous plant. WHY ARE YOU STOPPING TO LOOK AT IT?!
  components:
  # <Trauma>
  - type: HideableFoliage # For Diona Kudzu Vision
  # </Trauma>
  - type: MeleeSound
    soundGroups:
      Brute:
        path:
          "/Audio/Weapons/slash.ogg"
  - type: Sprite
    sprite: Objects/Misc/kudzu.rsi
    state: kudzu_11
    drawdepth: Overdoors
  - type: KudzuVisuals
  - type: Clickable
  - type: Fixtures
    fixtures:
      fix1:
        hard: false
        density: 7
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        layer:
        - MidImpassable
  - type: Damageable
    damageModifierSet: Wood
  - type: Injurable
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 10
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Reactive
    groups:
      Flammable: [Touch]
      Extinguish: [Touch]
    reactions:
    - reagents: [WeedKiller, PlantBGone]
      methods: [Touch]
      effects:
      - !type:HealthChange
        damage:
          types:
            Heat: 0.5
  - type: Kudzu
    growthTickChance: 0.3
    spreadChance: 0.2 # Trauma - was 0.4
  - type: SpeedModifierContacts
    walkSpeedModifier: 0.2
    sprintSpeedModifier: 0.2
    ignoreWhitelist:
      components:
      - IgnoreKudzu
  - type: Edible
    requiresSpecialDigestion: true
    delay: 0.5
  - type: FlavorProfile
    flavors:
    - fiber
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 0.1
  - type: Tag
    tags:
    - Ruminant

- type: entity
  parent: Kudzu
  id: WeakKudzu
  suffix: Weak
  components:
  - type: Kudzu
    spreadChance: 0.1 # Trauma - was 0.3

- type: entity
  parent: [ BaseKudzu, SolutionFood ]
  id: FleshKudzu
  name: tendons
  description: A rapidly growing cluster of meaty tendons. WHY ARE YOU STOPPING TO LOOK AT IT?!
  components:
  - type: MeleeSound
    soundGroups:
      Brute:
        path:
          "/Audio/Weapons/slash.ogg"
  - type: Sprite
    sprite: Objects/Misc/fleshkudzu.rsi
    state: kudzu_11
    drawdepth: Overdoors
  - type: KudzuVisuals
  - type: Clickable
  - type: Fixtures
    fixtures:
      fix1:
        hard: false
        density: 7
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        layer:
        - MidImpassable
  - type: Damageable
  - type: Injurable
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 40
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: DamageContacts
    damage:
      types:
        Slash: 1.5
        Piercing: 1.5
    ignoreWhitelist:
      tags:
      - Flesh
  - type: Kudzu
    growthTickChance: 0.1
    spreadChance: 0.2 # Trauma - was 0.4
    # Heals each time it manages to do a growth tick:
    damageRecovery:
      types:
        Slash: -0.5
        Heat: -1.0
        Cold: -1.0
        Blunt: -0.5 # Needs to be balanced (approx 3x) with vacuum damage to stall but not kill Kudzu
  - type: Edible # delightfully devilish !
    delay: 0.5
  - type: SpeedModifierContacts
    walkSpeedModifier: 0.3
    sprintSpeedModifier: 0.3
    ignoreWhitelist:
      tags:
      - Flesh
  - type: Solution
    solution:
      reagents:
      - ReagentId: Razorium
        Quantity: 2
      - ReagentId: Protein
        Quantity: 1
  - type: AutoEmote # Meat Kudzu used to have respirator, but couldn't breathe so all it would do is gasp.
    emotes:
    - MeatGasp
  - type: Tag
    tags:
    - Meat
    - Ruminant

