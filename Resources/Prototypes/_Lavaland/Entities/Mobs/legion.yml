- type: entity
  id: MobLegionSkull
  parent: [ BaseMobAsteroid, FlyingMobBase ]
  name: legion skull
  description: A fragment of the original legion, rallying behind its original. One isn't much of a threat, but...
  components:
  - type: Sprite
    sprite: _Lavaland/Mobs/legion.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: legion-skull
  - type: MovementSpeedModifier
    baseWalkSpeed : 3.5
    baseSprintSpeed : 4.0
  - type: MobThresholds
    thresholds:
      0: Alive
      5: Dead
  - type: MeleeWeapon
    angle: 0
    attackRate: 0.6
    range: 0.50
    animation: WeaponArcPunch
    damage:
      types:
        Blunt: 9 # Literally collides with you at full speed
  - type: Ammo
    muzzleFlash: null
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: NpcFactionMember
    factions:
    - Lavafauna
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
    blackboard: # highly aggressive
      VisionRadius: !type:Single
        15
      AggroVisionRadius: !type:Single
        15
      NavSmash: !type:Bool
        true
  - type: TimedDespawn
    lifetime: 45
