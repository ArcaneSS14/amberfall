- type: entity
  abstract: true
  parent: Stairs
  id: BaseLevelStairs
  name: level stairs
  description: A stairway connecting adjacent levels.
  components:
  - type: Sprite
    sprite: _Apotheosis/Structures/stairs.rsi
    state: stairs
    drawdepth: FloorTiles
  - type: Icon
    sprite: _Apotheosis/Structures/stairs.rsi
    state: stairs
  - type: Rotatable
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      transition:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.48,-0.48,0.48,0.48"
        layer:
        - WallLayer
        mask:
        - ItemMask
        density: 1000
        hard: false
  - type: StepTrigger
    requiredTriggeredSpeed: 0
    intersectRatio: 0.2
    ignoreWeightless: true

- type: entity
  abstract: true
  parent: BaseLevelStairs
  id: BaseLevelStairsUp
  components:
  - type: ZTransition
    direction: Up

- type: entity
  abstract: true
  parent: BaseLevelStairs
  id: BaseLevelStairsDown
  components:
  - type: ZTransition
    direction: Down

- type: entity
  parent: BaseLevelStairsUp
  id: LevelStairsDeepUp
  name: deep stone stairs
