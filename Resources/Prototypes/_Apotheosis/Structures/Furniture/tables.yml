- type: entity
  abstract: true
  parent: BaseStructure
  id: BaseRusticTable
  name: old table
  components:
  - type: Animateable
  - type: Sprite
    sprite: _Apotheosis/Structures/Furniture/Tables/tables.rsi
  - type: Icon
    sprite: _Apotheosis/Structures/Furniture/Tables/tables.rsi
  - type: Damageable
    damageModifierSet: Wood
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:DoActsBehavior
        acts: [Destruction]
  - type: PlaceableSurface
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 55
        mask: [TableMask]
        layer: [TableLayer]
  - type: SpriteFade
  - type: Climbable
  - type: Bonkable
    bonkDamage:
      types:
        Blunt: 4
  - type: Clickable
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepHull
  - type: Tag
    tags: [Table, ForceFixRotations]
  - type: RequireProjectileTarget
    ignoreThrow: true

