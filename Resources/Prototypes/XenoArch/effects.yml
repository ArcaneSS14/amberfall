    damageChance: 1
    radius: 8
    whitelist:
      components:
      - MobState
    damage:
      types:
        Blunt: -100
        Piercing: -100
        Ballistic: -100 # Trauma
        Slash: -100
        Heat: -100
        Cold: -100
        Shock: -100

- type: entity
  parent: BaseOneTimeXenoArtifactEffect
  id: XenoArtifactExplosionScary
  description: Small scale high-speed nuclear reaction
  components:
  - type: XAETriggerExplosives
  - type: Explosive
    deleteAfterExplosion: false
    explosionType: Radioactive
    totalIntensity: 300
    intensitySlope: 2
    maxIntensity: 1.5
    canCreateVacuum: false
    repeatable: true

- type: entity
  parent: BaseOneTimeXenoArtifactEffect
  id: XenoArtifactBoom
  description: Explosion
  components:
  - type: XAETriggerExplosives
  - type: Explosive
    deleteAfterExplosion: false
    explosionType: Default
    totalIntensity: 500
    intensitySlope: 2.5
    maxIntensity: 50
    repeatable: true

