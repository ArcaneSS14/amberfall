- type: entity
  parent: MobGorilla
  id: MobGorillaAngry
  suffix: Angry
  components:
  - type: NpcFactionMember
    factions:
    - SimpleHostile

- type: entity
  parent: MobGorillaAngry
  id: MobGorillaAngryTemp
  suffix: Angry, Lesser, Temporary
  components:
  - type: FadingTimedDespawn
    lifetime: 120
    fadeOutTime: 4
  - type: MobThresholds
    thresholds:
      0: Alive
      80: Critical
      100: Dead
  - type: SlowOnDamage
    speedModifierThresholds:
      60: 0.7
      70: 0.5

- type: entity
  parent: MobGorillaAngry
  id: MobGorillaWizard
  suffix: Wizard
  components:
  - type: NpcFactionMember
    factions:
    - SimpleHostile
    - Wizard
  - type: Speech
    speechVerb: LargeMob
  - type: MobThresholds
    thresholds:
      0: Alive
      250: Critical
      350: Dead
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 50
        Structural: 80
  - type: SlowOnDamage
    speedModifierThresholds:
      210: 0.7
      230: 0.5
  - type: Insulated
  - type: FlashImmunity
    showInExamine: false
  - type: Bloodstream
    maxBleedAmount: 0
  - type: StepTriggerImmune
  - type: NoSlip
  - type: Puller
    needsHands: false
  - type: Targeting
