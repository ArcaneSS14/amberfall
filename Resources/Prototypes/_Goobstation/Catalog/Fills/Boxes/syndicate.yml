- type: entity
  name: box of lube & glue grenades
  parent: BoxCardboard
  id: BoxReagentGrenades
  description: A box full of lube & glue grenades.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: LubeGrenade
          amount: 2
        - id: GlueGrenade
          amount: 2
  - type: Sprite
    layers:
    - state: box
    - state: flashbang
